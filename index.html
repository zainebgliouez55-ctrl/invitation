<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>e_learnX - Espace étudiant</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">e_learnX</div>
      <div id="header-user" class="header-user hidden">Bienvenue, <strong>Étudiant</strong></div>
    </header>

    <main class="main-content">
      <section id="login-screen" class="screen screen-center">
        <div class="card login-card">
          <h1>Connexion</h1>
          <p>Accédez à votre tableau de bord e_learnX</p>
          <input id="login-email" type="email" placeholder="Email" value="etudiant@example.com" />
          <input id="login-password" type="password" placeholder="Mot de passe" value="123456" />
          <button id="login-button" class="primary-button">Se connecter</button>
        </div>
      </section>

      <section id="dashboard-screen" class="screen hidden">
        <aside class="sidebar">
          <div class="sidebar-block">
            <h2>Navigation</h2>
            <button id="dashboard-home" class="nav-button active">Tableau de bord</button>
          </div>
          <div class="sidebar-block">
            <h3>Rechercher</h3>
            <input id="search-input" type="search" placeholder="Rechercher cours ou ressource" />
          </div>
          <div class="sidebar-block">
            <h3>Mon historique</h3>
            <ul id="history-list" class="history-list"></ul>
          </div>
        </aside>

        <section class="dashboard">
          <div class="dashboard-header">
            <div>
              <h1>Tableau de bord</h1>
              <p>Vos cours inscrits sont organisés par matière.</p>
            </div>
            <div class="badge-summary">
              <span id="total-courses-badge" class="badge">0 cours</span>
              <span id="completed-rate-badge" class="badge secondary">0 % complétés</span>
            </div>
          </div>

          <div id="courses-list" class="courses-list"></div>
        </section>
      </section>

      <section id="course-screen" class="screen hidden">
        <div class="course-topbar">
          <button id="back-dashboard" class="secondary-button">← Retour</button>
          <div>
            <h1 id="course-title"></h1>
            <p id="course-subtitle"></p>
          </div>
        </div>

        <div class="course-layout">
          <nav class="course-sidebar">
            <h2>Chapitres</h2>
            <ul id="chapter-list" class="chapter-list"></ul>
          </nav>

          <article class="course-content">
            <div class="course-actions">
              <button id="prev-chapter" class="secondary-button">Précédent</button>
              <button id="next-chapter" class="secondary-button">Suivant</button>
              <button id="download-material" class="primary-button">Télécharger le support</button>
            </div>

            <div class="content-panel">
              <div class="content-meta">
                <div id="chapter-badge" class="badge secondary">Chapitre 1</div>
                <p id="chapter-status">Statut : non vu</p>
              </div>

              <div id="chapter-description" class="chapter-description"></div>

              <div class="media-section">
                <div class="video-frame">
                  <video id="chapter-video" controls preload="metadata">
                    <source id="video-source" src="" type="video/mp4" />
                    Votre navigateur ne prend pas en charge la vidéo intégrée.
                  </video>
                </div>
                <div class="pdf-frame">
                  <iframe id="pdf-viewer" src="" title="Support PDF"></iframe>
                </div>
              </div>
            </div>
          </article>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
